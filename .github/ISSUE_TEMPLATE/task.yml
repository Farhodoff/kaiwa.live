name: "🛠️ Texnik Vazifa / Dasturlash (Task)"
description: "JLPT bazasi, AI Yuki Sensei, SM-2 yoki WebRTC bo'yicha texnik vazifa"
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Vazifa Maqsadi
      description: Qaysi modulda nima amalga oshirilishi kerak?
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Aloqador Modul
      options:
        - AI Voice Coach (Yuki Sensei & Speech API)
        - JLPT Mock Exams (N5 - N1)
        - Minna no Nihongo Baza (Goi & Bunpou)
        - Anki SM-2 Spaced Repetition Flashcards
        - Kanji Canvas & Stroke Practice
        - WebRTC Study Room & tldraw
        - Supabase (DB, RLS, Auth)
        - Telegram Mini App (TWA) & PWA
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Qabul Qilish Mezonlari
      value: |
        - [ ] Funksional to'liq ishlayapti
        - [ ] Vitest testlari muvaffaqiyatli o'tdi (`npm test -- --run`)
        - [ ] TypeScript va ESLint xatolari yo'q
