  <script id="config-init">
    (function() {
      try {
        if (window.location.pathname === '/twa') {
          window.location.replace('/jlpt');
        }
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
        const theme = localStorage.getItem('study_planner_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
        const lang = localStorage.getItem('study_planner_lang');
        const urlLang = new URLSearchParams(window.location.search).get('lang');
        if (urlLang === 'ja' || urlLang === 'uz' || urlLang === 'en') {
          document.documentElement.lang = urlLang;
        } else if (lang) {
          document.documentElement.lang = lang;
        }

        // Self-healing recovery for stale module scripts, MIME type mismatch, or PWA cache errors
        window.addEventListener('error', function(event) {
          var target = event.target;
          var isScriptOrLink = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          var message = (event.message || '').toLowerCase();
          var isModuleFailure = isScriptOrLink ||
            message.includes('failed to load module script') ||
            message.includes('mime type') ||
            message.includes('non-precached-url');
          if (isModuleFailure) {
            var reloadKey = 'kaiwa_live_stale_reload';
            var attempts = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
            if (attempts < 2) {
              sessionStorage.setItem(reloadKey, (attempts + 1).toString());
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                }).finally(function() {
                  if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(regs) {
                      regs.forEach(function(r) { r.unregister(); });
                      window.location.reload();
                    });
                  } else {
                    window.location.reload();
                  }
                });
              } else {
                window.location.reload();
              }
            }
          }
        }, true);
      } catch (e) {}
    })();
  </script>
